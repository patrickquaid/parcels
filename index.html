<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roton Hill Parcel Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .timeline-panel {
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      min-width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .timeline-panel h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #222;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container input[type="range"] {
      flex: 1;
      cursor: pointer;
    }

    .year-readout {
      font-weight: 700;
      font-size: 16px;
      color: #0b5394;
      min-width: 48px;
    }

    .step-btn {
      background: #f0f4f8;
      border: 1px solid #c5d2dc;
      color: #1a4e75;
      font-weight: 700;
      font-size: 13px;
      width: 28px;
      height: 28px;
      line-height: 26px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease;
      user-select: none;
    }

    .step-btn:hover {
      background: #0b5394;
      color: #fff;
      border-color: #0b5394;
    }

    .step-btn:active {
      transform: scale(0.94);
    }
    /* =========================================================
   Mobile Overrides (screens 600px wide or narrower)
   ========================================================= */
@media (max-width: 600px) {
  /* Pin the panel across the bottom edge of the screen */
  .leaflet-top.leaflet-right {
    width: 100%;
    top: auto;
    bottom: 0;
    right: 0;
    left: 0;
    pointer-events: none; /* Let touches pass through the wrapper */
  }

  /* Detach the timeline panel from Leaflet's corner container
     and anchor it directly to the bottom of the visible screen */
  .timeline-panel {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    box-sizing: border-box !important;
    margin: 0 !important;
    z-index: 1000 !important; /* Float cleanly above Leaflet tile layers */

    border-radius: 14px 14px 0 0;
    padding: 12px 16px;
    /* Respect Android gesture nav / iPhone home bars */
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    
    background: rgba(255, 255, 255, 0.98);
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.2);
  }

  /* Keep title compact to preserve vertical space */
  .timeline-panel h4 {
    font-size: 14px;
    margin: 0 0 8px 0;
    text-align: center;
  }

  /* Make sure controls stay on one horizontal line */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .slider-container input[type="range"] {
    flex: 1;
    min-width: 0; /* Prevents slider from blowing out container width */
    height: 24px;
  }

  /* Touch-friendly buttons that don't take up excessive vertical height */
  .step-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    font-size: 20px;
  }

  .year-readout {
    font-size: 16px;
    min-width: 44px;
    flex-shrink: 0;
    text-align: right;
  }

  /* Subtitle text under slider */
  .timeline-panel div[style*="font-size: 11px"] {
    margin-top: 4px !important;
    text-align: center;
  }

  /* Move Leaflet's default attribution / zoom controls out of the way */
  .leaflet-bottom.leaflet-left,
  .leaflet-bottom.leaflet-right {
    margin-bottom: 90px !important; /* Shifts the OSM attribution above our bottom panel */
  }

  /* Reposition default Leaflet zoom controls (+ / -) out of the way */
  .leaflet-top.leaflet-left {
    top: 10px;
    left: 10px;
  }

  /* Constrain popup bubbles */
  .leaflet-popup-content-wrapper {
    font-size: 14px;
    border-radius: 8px;
  }
  .leaflet-popup-content {
    margin: 10px 14px;
    line-height: 1.4;
  }
}
  </style>
  <script src="parcels.js"></script>
</head>

<body>

  <div id="map"></div>

  <script>
    // Initial settings
    let selectedYear = 1932;
    let geojsonLayer = null;

    // Determine if the parcel is active in the selected year
    function isParcelActive(feature) {
      const props = feature.properties || {};
      const validFrom = props.valid_from || props.YearBuilt || 0;
      const validTo = props.valid_to || 9999;
      // If there's a 'valid_to', it normally means that there's a replacement parcel
      // that year. We don't want to overlap.
      return (selectedYear >= validFrom && selectedYear < validTo);
    }
  
    // Determine if a parcel's YearBuilt is strictly greater than the slider's year
    function getParcelStyle(feature) {
      const props = feature.properties || {};
      // Handle case-sensitivity or string numbers from ArcGIS exports
      const rawYear = props.YearBuilt || props.YEARBUILT || props.year_built || props.YEAR_BUILT;
      const yearBuilt = parseInt(rawYear, 10);

      const isBuilt = (!isNaN(yearBuilt) && selectedYear >= yearBuilt);

      if (isBuilt) {
        // Highlight newly-built properties
        if ((selectedYear - yearBuilt) < 1) {
          return {
            fillOpacity: 0.50,
            fillColor: 'slateblue',
            opacity: 1,
            color: 'green',
            weight: 1,
          };
        }
        if (props.Notes) {
          return {
            fillOpacity: 0.50,
            fillColor: 'slateblue',
            opacity: 1,
            color: 'blue',
            weight: 1.5,
          };
        } else {
          return {
            fillOpacity: 0.50,
            fillColor: 'slateblue',
            opacity: 1,
            color: 'slateblue',
            weight: 1,
          };
        }
      } else {
        // Not yet built
        if (props.Notes) {
          // Highlight plots with Notes
          return {
            fillOpacity: 0.20,
            fillColor: 'tan',
            opacity: 1,
            color: 'brown',
            weight: 1.5
          };
        } else {
          return {
            fillOpacity: 0.20,
            fillColor: 'tan',
            opacity: 0.20,
            color: 'tan',
            weight: 1
          };
        }
      }
    }

    function formatAddress(str) {
        if (!str) return '';

        // Canonical mapping for standard street abbreviations & directionals
        const standardSuffixes = {
          st: 'St', ave: 'Ave', rd: 'Rd', ln: 'Ln', dr: 'Dr', ct: 'Ct',
          pl: 'Pl', blvd: 'Blvd', way: 'Way', ter: 'Ter', cir: 'Cir',
          pkwy: 'Pkwy', hwy: 'Hwy',
          // Directionals (keep uppercase)
          n: 'N', s: 'S', e: 'E', w: 'W',
          ne: 'NE', nw: 'NW', se: 'SE', sw: 'SW'
        };

        return str
          .toLowerCase()
          .split(/\s+/)
          .map(word => {
            // Check if the word is a known suffix or directional
            if (standardSuffixes[word]) {
              return standardSuffixes[word];
            }
            // Standard title case: capitalize first letter, handle hyphens if any
            return word.replace(/(?:^|-)([a-z])/g, (_, letter) => letter.toUpperCase());
          })
          .join(' ');
      }

    function refreshParcels() {
      if (geojsonLayer) {
        map.removeLayer(geojsonLayer);
      }
      geojsonLayer = L.geoJSON(parcelData.features, {
        filter: isParcelActive,
        style: getParcelStyle,
        onEachFeature: function (feature, layer) {
        const props = feature.properties || {};

        const yr = props.YearBuilt ? `<br>Year Built: ${props.YearBuilt}` : '';
        const lotId = props.ParcelID ? `<br>Parcel ${props.ParcelID}` : '';
        const location = formatAddress(props.Location);
        const notes = props.Notes ? `<br><br>${props.Notes}` : '';

        layer.bindPopup(`<strong>${location}</strong>${yr}${lotId}${notes}`);
      }
      }).addTo(map);
    }

    const map = L.map('map').setView([41.085, -73.432], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 1. Create the floating Leaflet control with step buttons
    const sliderControl = L.control({ position: 'topright' });

    sliderControl.onAdd = function (map) {
      const container = L.DomUtil.create('div', 'timeline-panel');

      // Prevent clicks and dragging on the controls from interacting with the map
      L.DomEvent.disableClickPropagation(container);
      L.DomEvent.disableScrollPropagation(container);
      L.DomEvent.on(container, 'touchstart touchmove touchend', L.DomEvent.stopPropagation);

      container.innerHTML = `
    <h4>Filter by Year Built</h4>
    <div class="slider-container">
      <button id="prevYearBtn" class="step-btn" title="Previous Year">&minus;</button>
      <input id="timelineSlider" type="range" min="1800" max="2026" step="1" value="${selectedYear}">
      <button id="nextYearBtn" class="step-btn" title="Next Year">&plus;</button>
      <span id="yearValue" class="year-readout">${selectedYear}</span>
    </div>
    <div style="font-size: 11px; color: #666; margin-top: 6px;">
      Showing parcels built after <span id="hintYear">${selectedYear}</span>
    </div>
  `;
      return container;
    };
    sliderControl.addTo(map);

    // 2. Helper to sync all UI elements and re-style parcels
    function setYear(year) {
      const min = parseInt(slider.min, 10);
      const max = parseInt(slider.max, 10);

      // Clamp between min and max
      selectedYear = Math.max(min, Math.min(max, parseInt(year, 10)));

      slider.value = selectedYear;
      readout.textContent = selectedYear;
      hint.textContent = selectedYear;

      refreshParcels();
    }

    // 3. Connect UI elements
    const slider = document.getElementById('timelineSlider');
    const readout = document.getElementById('yearValue');
    const hint = document.getElementById('hintYear');
    const prevBtn = document.getElementById('prevYearBtn');
    const nextBtn = document.getElementById('nextYearBtn');

    // Slider drag/input
    slider.addEventListener('input', function (e) {
      setYear(e.target.value);
    });

    // Step back one year
    prevBtn.addEventListener('click', function () {
      setYear(selectedYear - 1);
    });

    // Step forward one year
    nextBtn.addEventListener('click', function () {
      setYear(selectedYear + 1);
    });

    refreshParcels();

    map.fitBounds(geojsonLayer.getBounds());

  </script>

</body>

</html>
